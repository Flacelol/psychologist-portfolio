<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретна Адмін Панель - Анастасія Заболотна</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .admin-wrapper { max-width: 800px; margin: 60px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .login-wrapper { max-width: 400px; margin: 100px auto; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); text-align: center; }
        .hidden { display: none; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 1rem; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-color); outline: none; }
        .article-list { margin-top: 40px; }
        .article-item { border: 1px solid #eee; padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        .btn-danger { background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-danger:hover { background: #ff6b81; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18070432399"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18070432399');
    </script>
</head>
<body>

    <!-- Екран логіну -->
    <div id="loginSection" class="login-wrapper">
        <h2 style="color: var(--primary-color); margin-bottom: 25px;">Вхід для адміністратора</h2>
        <div class="form-group">
            <input type="password" id="adminPassword" placeholder="Введіть секретний пароль" onkeypress="if(event.key === 'Enter') window.checkPassword()">
        </div>
        <button type="button" id="loginBtn" class="btn-submit" style="width: 100%;" onclick="window.checkPassword()">Увійти</button>
        <p id="loginError" style="color: #ff4757; margin-top: 15px; display: none; font-weight: 500;">Невірний пароль!</p>
    </div>

    <!-- Адмін панель -->
    <div id="adminSection" class="admin-wrapper hidden">
        <div class="header-admin">
            <h2 style="color: var(--primary-color); margin: 0;">Панель управління</h2>
            <button type="button" class="btn-secondary" id="logoutBtn" onclick="window.logout()">Вийти</button>
        </div>

        <!-- Таби -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('articles')">Статті</div>
            <div class="tab" onclick="switchTab('photos')">Фото з груп</div>
            <div class="tab" onclick="switchTab('certificates')">Сертифікати</div>
            <div class="tab" onclick="switchTab('requests')">Заявки з сайту</div>
        </div>

        <div id="requestsSection" style="display: none;">
            <div style="background: #f8fdfd; border: 1px solid #e0f2f1; padding: 25px; border-radius: 10px; margin-bottom: 40px;">
                <h3 style="color: var(--primary-color); margin-bottom: 1rem;">Останні заявки</h3>
                <div id="requestsList" style="display: flex; flex-direction: column; gap: 15px;">
                    <p>Завантаження...</p>
                </div>
            </div>
        </div>

        <!-- УПРАВЛІННЯ СТАТТЯМИ -->
        <div style="background: #f8fdfd; border: 1px solid #e0f2f1; padding: 25px; border-radius: 10px; margin-bottom: 40px;">
            <h3 style="margin-top: 0; margin-bottom: 20px; color: #333;">✍️ Додати нову статтю</h3>
            
            <div class="form-group">
                <label>Заголовок статті *</label>
                <input type="text" id="artTitle" placeholder="Наприклад: Як допомогти дитині подолати стрес">
            </div>
            
            <div class="form-group">
                <label>Дата *</label>
                <input type="date" id="artDate">
            </div>
            
            <div class="form-group">
                <label>Текст статті *</label>
                <textarea id="artText" rows="6" placeholder="Напишіть тут текст статті або новини..."></textarea>
            </div>
            
            <button type="button" class="btn-primary" id="addBtn" onclick="window.addArticle()">Опублікувати статтю</button>
        </div>

        <h3>📚 Опубліковані статті</h3>
        <div id="articlesList" class="article-list" style="margin-bottom: 50px;">
            <!-- Список статей -->
        </div>

        <hr style="border: 0; border-top: 2px solid #eee; margin: 40px 0;">

        <!-- УПРАВЛІННЯ ФОТОГРАФІЯМИ -->
        <div style="background: #fff8e1; border: 1px solid #ffecb3; padding: 25px; border-radius: 10px; margin-bottom: 40px;">
            <h3 style="margin-top: 0; margin-bottom: 20px; color: #333;">📸 Додати фото з групових робіт</h3>
            
            <div class="form-group">
                <label>Виберіть фотографію *</label>
                <input type="file" id="photoInput" accept="image/*" style="background: #fff; padding: 8px;">
            </div>
            
            <button type="button" class="btn-primary" id="uploadPhotoBtn" onclick="window.uploadPhoto()" style="background-color: #ffb300; color: #333;">Завантажити фотографію</button>
        </div>

        <h3>🖼️ Завантажені фотографії</h3>
        <div id="photosList" class="article-list">
            <!-- Список фото -->
        </div>

        <!-- УПРАВЛІННЯ СЕРТИФІКАТАМИ -->
        <hr style="border: 0; border-top: 2px solid #eee; margin: 40px 0;">

        <div style="background: #f3e5f5; border: 1px solid #ce93d8; padding: 25px; border-radius: 10px; margin-bottom: 40px;">
            <h3 style="margin-top: 0; margin-bottom: 20px; color: #333;">🎓 Додати сертифікат</h3>
            
            <div class="form-group">
                <label>Назва сертифікату *</label>
                <input type="text" id="certTitle" placeholder="Наприклад: Курс з арттерапії">
            </div>
            
            <div class="form-group">
                <label>Виберіть фотографію сертифікату *</label>
                <input type="file" id="certInput" accept="image/*" style="background: #fff; padding: 8px;">
            </div>
            
            <button type="button" class="btn-primary" id="uploadCertBtn" onclick="window.uploadCertificate()" style="background-color: #8e24aa; color: white;">Завантажити сертифікат</button>
        </div>

        <h3>📜 Завантажені сертифікати</h3>
        <div id="certsList" class="article-list" style="margin-bottom: 50px;">
            <!-- Список сертифікатів -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Пароль для входу в адмінку
        const SECRET_PASS = "As270910";

        let mySupabaseClient = null;

        function initSupabase() {
            if (!mySupabaseClient) {
                // Supabase конфігурація
                const supabaseUrl = 'https://zfxmdgofavotuwaapnaw.supabase.co';
                const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmeG1kZ29mYXZvdHV3YWFwbmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzIzODcsImV4cCI6MjA5MTI0ODM4N30.zUHzviNcfB5le8jvJBwsXKvOs_tNAO4Eq5QJ1FwDWYk';
                mySupabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
            }
        }

        window.checkPassword = function() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === SECRET_PASS) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                document.getElementById('loginError').style.display = 'none';
                sessionStorage.setItem('isPsyAdmin', 'true');
                
                document.getElementById('artDate').valueAsDate = new Date();
                
                window.renderAdminArticles();
                window.renderAdminPhotos();
                window.renderAdminCertificates();
                window.renderAdminRequests();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        };

        window.logout = function() {
            sessionStorage.removeItem('isPsyAdmin');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('adminPassword').value = '';
        };

        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            
            // Ми використовуємо inline-стилі display, тому скидаємо їх через DOM
            document.getElementById('articlesSection').style.display = 'none';
            document.getElementById('photosSection').style.display = 'none';
            document.getElementById('certificatesSection').style.display = 'none';
            document.getElementById('requestsSection').style.display = 'none';

            if (tabName === 'articles') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('articlesSection').style.display = 'block';
            } else if (tabName === 'photos') {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('photosSection').style.display = 'block';
            } else if (tabName === 'certificates') {
                document.querySelectorAll('.tab')[2].classList.add('active');
                document.getElementById('certificatesSection').style.display = 'block';
            } else if (tabName === 'requests') {
                document.querySelectorAll('.tab')[3].classList.add('active');
                document.getElementById('requestsSection').style.display = 'block';
                window.renderAdminRequests();
            }
        };

        window.addArticle = async function() {
            initSupabase();
            const title = document.getElementById('artTitle').value.trim();
            const date = document.getElementById('artDate').value;
            const text = document.getElementById('artText').value.trim();

            if (!title || !date || !text) {
                alert("Будь ласка, заповніть всі обов'язкові поля: Заголовок, Дата та Текст!");
                return;
            }

            // Показуємо стан завантаження
            const btn = document.getElementById('addBtn');
            const originalText = btn.innerText;
            btn.innerText = "Збереження...";
            btn.disabled = true;

            try {
                const { data, error } = await mySupabaseClient
                    .from('articles')
                    .insert([{ title, date, text, link: null }]);

                if (error) {
                    alert("Помилка збереження: " + error.message);
                    return;
                }

                document.getElementById('artTitle').value = '';
                document.getElementById('artText').value = '';

                await window.renderAdminArticles();
                alert("Статтю успішно опубліковано! Вона з'явилася на сторінці 'Статті'.");
            } catch (err) {
                alert("Сталася помилка: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };

        // Забезпечуємо правильну ініціалізацію при завантаженні сторінки
        window.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('isPsyAdmin') === 'true') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                document.getElementById('artDate').valueAsDate = new Date();
                renderAdminArticles();
                window.renderAdminPhotos();
                window.renderAdminCertificates();
            }
        });

        // Видалення
        window.deleteArticle = async function(id) {
            initSupabase();
            if (confirm("Ви впевнені, що хочете видалити цю статтю назавжди?")) {
                try {
                    const { error } = await mySupabaseClient
                        .from('articles')
                        .delete()
                        .eq('id', id);
                        
                    if (error) {
                        alert("Помилка видалення: " + error.message);
                    } else {
                        renderAdminArticles();
                    }
                } catch(err) {
                    alert("Сталася помилка: " + err.message);
                }
            }
        };

        window.renderAdminRequests = async function() {
            initSupabase();
            const list = document.getElementById('requestsList');
            list.innerHTML = "<p>Завантаження заявок...</p>";

            try {
                const { data: requests, error } = await mySupabaseClient
                    .from('contact_requests')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!requests || requests.length === 0) {
                    list.innerHTML = "<p style='color: #666; font-style: italic;'>Поки що немає нових заявок.</p>";
                    return;
                }

                list.innerHTML = requests.map(req => {
                    const d = new Date(req.created_at);
                    const dateStr = isNaN(d) ? req.created_at : d.toLocaleString('uk-UA');

                    return `
                    <div style="background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                            <strong>${req.name}</strong>
                            <span style="color: #888; font-size: 0.9em;">${dateStr}</span>
                        </div>
                        <div style="display: flex; gap: 20px; margin-bottom: 10px; flex-wrap: wrap;">
                            <div><i class="fas fa-envelope" style="color: var(--primary-color);"></i> <a href="mailto:${req.email}">${req.email}</a></div>
                            <div><i class="fas fa-phone" style="color: var(--primary-color);"></i> <a href="tel:${req.phone}">${req.phone}</a></div>
                        </div>
                        <div style="background: #f9f9f9; padding: 10px; border-radius: 5px; font-style: italic;">
                            ${req.message.replace(/\n/g, '<br>')}
                        </div>
                        <button class="btn-delete" style="margin-top: 15px;" onclick="deleteRequest('${req.id}')">Видалити заявку</button>
                    </div>`;
                }).join('');

            } catch(err) {
                list.innerHTML = "<p style='color: red;'>Помилка: " + err.message + "</p>";
            }
        };

        window.deleteRequest = async function(id) {
            if (confirm("Ви впевнені, що хочете видалити цю заявку?")) {
                initSupabase();
                try {
                    const { error } = await mySupabaseClient
                        .from('contact_requests')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;
                    window.renderAdminRequests();
                } catch(err) {
                    alert("Сталася помилка: " + err.message);
                }
            }
        };

        window.renderAdminArticles = async function() {
            initSupabase();
            const list = document.getElementById('articlesList');
            list.innerHTML = "<p>Завантаження...</p>";
            
            try {
                const { data: articles, error } = await mySupabaseClient
                    .from('articles')
                    .select('*')
                    .order('date', { ascending: false });
                    
                if (error) {
                    list.innerHTML = "<p style='color: red;'>Помилка завантаження: " + error.message + "</p>";
                    return;
                }

                if (!articles || articles.length === 0) {
                    list.innerHTML = "<p style='color: #666; font-style: italic;'>Ви ще не додали жодної власної статті.</p>";
                    return;
                }

                list.innerHTML = articles.map(art => {
                    const d = new Date(art.date);
                    const dateStr = isNaN(d) ? art.date : d.toLocaleDateString('uk-UA');
                    
                    return `
                    <div class="article-item">
                        <div>
                            <strong style="font-size: 1.1rem; color: var(--primary-color);">${art.title}</strong> <br>
                            <small style="color: #888;">Опубліковано: ${dateStr}</small>
                        </div>
                        <button type="button" class="btn-danger" onclick="deleteArticle('${art.id}')"><i class="fas fa-trash"></i> Видалити</button>
                    </div>
                `}).join('');
            } catch(err) {
                list.innerHTML = "<p style='color: red;'>Сталася помилка: " + err.message + "</p>";
            }
        };
        // Функції для фотографій
        window.uploadPhoto = async function() {
            initSupabase();
            const fileInput = document.getElementById('photoInput');
            const file = fileInput.files[0];

            if (!file) {
                alert("Будь ласка, виберіть фотографію для завантаження!");
                return;
            }

            const btn = document.getElementById('uploadPhotoBtn');
            const originalText = btn.innerText;
            btn.innerText = "Завантаження...";
            btn.disabled = true;

            try {
                // Створюємо унікальне ім'я файлу
                const fileExt = file.name.split('.').pop();
                const fileName = Date.now() + '_' + Math.random().toString(36).substring(2, 9) + '.' + fileExt;

                // Завантажуємо в Supabase Storage
                const { data: uploadData, error: uploadError } = await mySupabaseClient.storage
                    .from('photos')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                // Отримуємо публічне посилання
                const { data: { publicUrl } } = mySupabaseClient.storage
                    .from('photos')
                    .getPublicUrl(fileName);

                // Зберігаємо запис в БД
                const { error: dbError } = await mySupabaseClient
                    .from('group_photos')
                    .insert([{ image_url: publicUrl }]);

                if (dbError) throw dbError;

                fileInput.value = '';
                await window.renderAdminPhotos();
                alert("Фотографію успішно додано!");

            } catch (err) {
                console.error(err);
                alert("Сталася помилка при завантаженні: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };

        window.deletePhoto = async function(id) {
            initSupabase();
            if (confirm("Ви впевнені, що хочете видалити це фото назавжди?")) {
                try {
                    // Видаляємо з БД. Зі стореджа видаляти складніше без збереження шляху файлу, тому поки просто прибираємо з сайту
                    const { error } = await mySupabaseClient
                        .from('group_photos')
                        .delete()
                        .eq('id', id);
                        
                    if (error) throw error;
                    window.renderAdminPhotos();
                } catch(err) {
                    alert("Сталася помилка: " + err.message);
                }
            }
        };

        window.renderAdminPhotos = async function() {
            initSupabase();
            const list = document.getElementById('photosList');
            list.innerHTML = "<p>Завантаження фотографій...</p>";
            
            try {
                const { data: photos, error } = await mySupabaseClient
                    .from('group_photos')
                    .select('*')
                    .order('created_at', { ascending: false });
                    
                if (error) throw error;

                if (!photos || photos.length === 0) {
                    list.innerHTML = "<p style='color: #666; font-style: italic;'>Ви ще не завантажили жодної фотографії.</p>";
                    return;
                }

                list.innerHTML = photos.map(photo => {
                    const d = new Date(photo.created_at);
                    const dateStr = isNaN(d) ? photo.created_at : d.toLocaleDateString('uk-UA');
                    
                    return `
                    <div class="article-item" style="align-items: flex-start;">
                        <div>
                            <img src="${photo.image_url}" alt="Фото" style="width: 150px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #eee;">
                            <br><small style="color: #888;">Додано: ${dateStr}</small>
                        </div>
                        <button type="button" class="btn-danger" onclick="window.deletePhoto('${photo.id}')" style="margin-top: 10px;"><i class="fas fa-trash"></i> Видалити</button>
                    </div>
                `}).join('');
            } catch(err) {
                list.innerHTML = "<p style='color: red;'>Сталася помилка: " + err.message + "</p>";
            }
        };

        // Функції для сертифікатів
        window.uploadCertificate = async function() {
            initSupabase();
            const title = document.getElementById('certTitle').value.trim();
            const fileInput = document.getElementById('certInput');
            const file = fileInput.files[0];

            if (!title || !file) {
                alert("Будь ласка, введіть назву та виберіть фотографію сертифікату!");
                return;
            }

            const btn = document.getElementById('uploadCertBtn');
            const originalText = btn.innerText;
            btn.innerText = "Завантаження...";
            btn.disabled = true;

            try {
                // Створюємо унікальне ім'я файлу
                const fileExt = file.name.split('.').pop();
                const fileName = 'cert_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9) + '.' + fileExt;

                // Завантажуємо в Supabase Storage (в ту ж папку photos)
                const { data: uploadData, error: uploadError } = await mySupabaseClient.storage
                    .from('photos')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                // Отримуємо публічне посилання
                const { data: { publicUrl } } = mySupabaseClient.storage
                    .from('photos')
                    .getPublicUrl(fileName);

                // Зберігаємо запис в БД
                const { error: dbError } = await mySupabaseClient
                    .from('certificates')
                    .insert([{ title: title, image_url: publicUrl }]);

                if (dbError) throw dbError;

                document.getElementById('certTitle').value = '';
                fileInput.value = '';
                await window.renderAdminCertificates();
                alert("Сертифікат успішно додано!");

            } catch (err) {
                console.error(err);
                alert("Сталася помилка при завантаженні: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };

        window.deleteCertificate = async function(id) {
            initSupabase();
            if (confirm("Ви впевнені, що хочете видалити цей сертифікат назавжди?")) {
                try {
                    const { error } = await mySupabaseClient
                        .from('certificates')
                        .delete()
                        .eq('id', id);
                        
                    if (error) throw error;
                    window.renderAdminCertificates();
                } catch(err) {
                    alert("Сталася помилка: " + err.message);
                }
            }
        };

        window.renderAdminCertificates = async function() {
            initSupabase();
            const list = document.getElementById('certsList');
            list.innerHTML = "<p>Завантаження сертифікатів...</p>";
            
            try {
                const { data: certs, error } = await mySupabaseClient
                    .from('certificates')
                    .select('*')
                    .order('created_at', { ascending: false });
                    
                if (error) throw error;

                if (!certs || certs.length === 0) {
                    list.innerHTML = "<p style='color: #666; font-style: italic;'>Ви ще не завантажили жодного сертифікату.</p>";
                    return;
                }

                list.innerHTML = certs.map(cert => {
                    const d = new Date(cert.created_at);
                    const dateStr = isNaN(d) ? cert.created_at : d.toLocaleDateString('uk-UA');
                    
                    return `
                    <div class="article-item" style="align-items: flex-start;">
                        <div>
                            <strong style="color: #8e24aa;">${cert.title}</strong><br>
                            <img src="${cert.image_url}" alt="${cert.title}" style="width: 150px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; margin-top: 10px;">
                            <br><small style="color: #888;">Додано: ${dateStr}</small>
                        </div>
                        <button type="button" class="btn-danger" onclick="window.deleteCertificate('${cert.id}')" style="margin-top: 10px;"><i class="fas fa-trash"></i> Видалити</button>
                    </div>
                `}).join('');
            } catch(err) {
                list.innerHTML = "<p style='color: red;'>Сталася помилка: " + err.message + "</p>";
            }
        };

    </script>
</body>
</html>
